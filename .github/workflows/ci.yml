name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore apps/api/TenderScope.Api.csproj
      - run: dotnet restore apps/worker/TenderScope.Worker.csproj
      - run: dotnet build apps/api/TenderScope.Api.csproj --configuration Release --no-restore
      - run: dotnet build apps/worker/TenderScope.Worker.csproj --configuration Release --no-restore
      - run: dotnet test tests/TenderScope.Domain.Tests/TenderScope.Domain.Tests.csproj --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
