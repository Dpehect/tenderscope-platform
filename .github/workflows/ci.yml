name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tenderscope_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tenderscope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_POSTGRES: Host=localhost;Port=5432;Database=tenderscope_test;Username=postgres;Password=postgres
      ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=tenderscope_test;Username=postgres;Password=postgres
      Jwt__Secret: ci-only-secret-key-with-at-least-thirty-two-characters
      Jwt__Issuer: TenderScope.CI
      Jwt__Audience: TenderScope.CI.Web
      Jwt__AllowHttp: true
      Cors__AllowedOrigins__0: http://localhost:3000
      ASPNETCORE_ENVIRONMENT: Development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: |
            apps/api/TenderScope.Api.csproj
            tests/TenderScope.Tests/TenderScope.Tests.csproj
            src/**/*.csproj
      - run: dotnet restore apps/api/TenderScope.Api.csproj
      - run: dotnet restore tests/TenderScope.Tests/TenderScope.Tests.csproj
      - run: dotnet list apps/api/TenderScope.Api.csproj package --vulnerable --include-transitive
      - run: dotnet build apps/api/TenderScope.Api.csproj -c Release --no-restore
      - run: dotnet build tests/TenderScope.Tests/TenderScope.Tests.csproj -c Release --no-restore
      - run: dotnet test tests/TenderScope.Tests/TenderScope.Tests.csproj -c Release --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=tests.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            tests/**/TestResults/**/*.trx
            tests/**/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
      - name: Start API and run smoke test
        shell: bash
        run: |
          dotnet run --project apps/api/TenderScope.Api.csproj -c Release --no-build --urls http://127.0.0.1:8080 > api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true; cat api.log' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health > health.json; then
              cat health.json
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy"
          exit 1
      - run: docker build -f apps/api/Dockerfile -t tenderscope-api:ci .

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_SITE_URL: https://example.com
